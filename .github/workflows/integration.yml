name: Quality, build, and database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: Check changed files for whitespace errors
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

  integration:
    name: PostgreSQL unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: db0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d db0"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRESQL_URL: postgresql://test:test@localhost:5432/db0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:integration

  sqlite-minimum-runtime:
    name: SQLite minimum runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --project scripts/tsconfig.json
      - run: pnpm build
      - uses: actions/setup-node@v5
        with:
          node-version: 22.5.0
          package-manager-cache: false
      - run: node --experimental-sqlite scripts/sqlite-runtime-smoke.mjs
